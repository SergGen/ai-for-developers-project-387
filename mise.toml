[tools]
node = "26.13.1"

[tasks.setup]
description = "Install project dependencies and generate the API"
run = ["npm ci", "npm run generate"]

[tasks.frontend]
description = "Start the Vite development server"
run = "npm run dev"

[tasks.backend]
description = "Start the Fastify development server"
run = "npm run dev:server"

[tasks.build]
description = "Build the frontend"
run = "npm run build"

[tasks.check]
description = "Generate the API and run lint, type checks, and tests"
run = ["npm run generate", "npm run lint", "npm run typecheck", "npm test", "npm run test:e2e"]
