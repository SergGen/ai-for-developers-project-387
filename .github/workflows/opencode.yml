name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.comment.outputs.allowed }}
    steps:
      - name: Check command, author and pull request
        id: comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! jq -e '
            .comment.user.type == "User" and
            ((.comment.body // "") | test("^\\s*/(opencode|oc)(\\s|$)"; "i"))
          ' "$GITHUB_EVENT_PATH" >/dev/null; then
            exit 0
          fi

          author=$(jq -er '.comment.user.login' "$GITHUB_EVENT_PATH")
          if ! permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" --jq '.permission'); then
            echo "::warning::Could not verify the comment author's repository permissions."
            exit 0
          fi
          case "$permission" in
            admin|write) ;;
            *) exit 0 ;;
          esac

          # An issue_comment on a PR includes a link, but no head repository.
          if jq -e 'has("pull_request") or (.issue | has("pull_request"))' "$GITHUB_EVENT_PATH" >/dev/null; then
            number=$(jq -er '.pull_request.number // .issue.number' "$GITHUB_EVENT_PATH")
            repository_id=$(jq -er '.repository.id' "$GITHUB_EVENT_PATH")
            if ! head_id=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.repo.id'); then
              echo "::warning::Could not verify the pull request head repository."
              exit 0
            fi
            [[ "$head_id" == "$repository_id" ]] || exit 0
          fi

          echo 'allowed=true' >> "$GITHUB_OUTPUT"

  opencode:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: openai/gpt-6.2-sol
          mentions: /opencode,/oc
          share: 'false'
